services:
  - type: web
    name: phantom-ai
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TITAN_API_BASE_URL
        sync: false
      - key: TITAN_API_KEY
        sync: false
      - key: TITAN_MODEL
        value: titan.1.R
